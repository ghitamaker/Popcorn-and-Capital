<!DOCTYPE html>
<!--
  ==========================================================================
  POPCORN & CAPITAL — Accueil (index.html)
  Carnet de recherche privé : Ingénierie Financière du Cinéma.
  --------------------------------------------------------------------------
  L'accueil affiche TOUS les contenus (articles, études de cas, fiches),
  du plus récent au plus ancien, avec un bouton pour inverser l'ordre.

  FICHIERS UTILISÉS (dans le même dossier) :
    - contenus.js            → LA LISTE DE TOUS VOS CONTENUS (le seul fichier à
                               modifier pour ajouter un article, une étude, une fiche)
    - assets/style.css       → couleurs (mode clair / sombre) et mise en forme
    - assets/tailwind-config.js, assets/site.js → fonctionnement (ne pas modifier)
    - logo.svg, images/      → le logo et les images
  ==========================================================================
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CONFIDENTIALITÉ : NE JAMAIS SUPPRIMER CETTE LIGNE.
       Elle demande à Google (et aux autres moteurs) de ne pas indexer la page. -->
  <meta name="robots" content="noindex, nofollow">

  <title>Popcorn &amp; Capital — Carnet de recherche</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">

  <!-- POLICES : Bebas Neue (nom du site) + Playfair Display (titres) + Inter (textes) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- TAILWIND CSS via CDN, puis les réglages communs du site (couleurs, mode sombre) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tailwind-config.js"></script>

  <!-- Styles communs (couleurs du mode clair / sombre, mise en forme des textes) -->
  <link rel="stylesheet" href="assets/style.css">
</head>

<body class="bg-paper text-ink font-sans">

  <!-- ======================================================================
       EN-TÊTE : logo, titre et menu (identique sur toutes les pages).
       ⚠️ Si vous modifiez le menu, faites la même modification dans chaque page.
       Le lien de la page en cours porte aria-current="page" et "border-ink"
       (souligné) ; les autres portent "border-transparent".
       ====================================================================== -->
  <header class="relative px-5 pt-12 sm:pt-16">

    <!-- BOUTON MODE CLAIR / SOMBRE (le choix est mémorisé par le navigateur) -->
    <button id="theme-toggle" type="button"
            class="absolute top-4 right-4 sm:top-6 sm:right-8 flex items-center gap-2 rounded-full border border-ink/20 px-3 py-1.5 text-[10px] font-medium uppercase tracking-[0.2em] text-muted hover:text-ink hover:border-ink/50 transition-colors"
            aria-label="Basculer entre le mode clair et le mode sombre">
      <svg class="w-3.5 h-3.5 dark:hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="w-3.5 h-3.5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="hidden sm:inline dark:sm:hidden">Mode sombre</span>
      <span class="hidden dark:sm:inline">Mode clair</span>
    </button>

    <div class="text-center">
      <!-- LOGO, puis TITRE en dessous (police Bebas Neue, style affiche de cinéma) -->
      <a href="index.html" class="inline-flex flex-col items-center">
        <img src="logo.svg" alt="Logo Popcorn &amp; Capital" class="w-24 h-24 sm:w-28 sm:h-28 mb-4">
        <span class="font-display uppercase tracking-[0.04em] whitespace-nowrap text-[clamp(2.25rem,11vw,4rem)] sm:text-8xl leading-none">Popcorn &amp; Capital</span>
      </a>
    </div>

    <nav class="max-w-6xl mx-auto mt-8 border-t border-ink border-b" aria-label="Navigation principale">
      <ul class="flex flex-wrap justify-center gap-x-8 sm:gap-x-14 gap-y-2 py-4 text-[11px] font-medium uppercase tracking-[0.22em]">
        <li><a href="index.html" aria-current="page" class="pb-1 border-b border-ink">Accueil</a></li>
        <li><a href="etudes-de-cas.html" class="pb-1 border-b border-transparent hover:border-ink transition-colors">Études de cas</a></li>
        <li><a href="fiches-techniques.html" class="pb-1 border-b border-transparent hover:border-ink transition-colors">Fiches techniques</a></li>
        <li><a href="a-propos.html" class="pb-1 border-b border-transparent hover:border-ink transition-colors">À propos</a></li>
      </ul>
    </nav>
  </header>

  <main class="px-5">
    <section class="max-w-6xl mx-auto pt-12 sm:pt-16">
      <h1 class="sr-only">Tous les contenus</h1>

      <!-- Barre d'outils : nombre de contenus + choix de l'ordre d'affichage -->
      <div class="flex flex-wrap items-center justify-between gap-4 border-b border-ink/15 pb-4 mb-12">
        <p id="compteur" class="text-[11px] font-medium uppercase tracking-[0.25em] text-muted"></p>
        <div class="flex items-center gap-5 text-[11px] font-medium uppercase tracking-[0.2em]" role="group" aria-label="Ordre d'affichage">
          <span class="text-muted">Trier :</span>
          <button type="button" class="choix" data-ordre="recent" aria-pressed="true">Plus récents</button>
          <button type="button" class="choix" data-ordre="ancien" aria-pressed="false">Plus anciens</button>
        </div>
      </div>
      <!-- La grille se remplit toute seule à partir du fichier contenus.js.
           Pour ajouter un contenu ici, c'est dans contenus.js que ça se passe. -->
      <div id="grille" data-type="tout" class="grid gap-x-8 gap-y-14 sm:grid-cols-2 lg:grid-cols-3"></div>

      <p id="grille-vide" hidden class="py-16 text-center font-serif italic text-xl text-muted">Aucun contenu pour le moment.</p>
      <noscript><p class="py-16 text-center text-muted">Activez JavaScript pour afficher les contenus.</p></noscript>
    </section>
  </main>

  <!-- ======================================================================
       PIED DE PAGE (identique sur toutes les pages)
       ====================================================================== -->
  <footer class="px-5 pb-12">
    <div class="max-w-6xl mx-auto border-t-[5px] border-double border-ink pt-8 flex flex-col items-center gap-3 text-center">
      <p class="font-display uppercase tracking-[0.04em] text-2xl">Popcorn &amp; Capital</p>
      <p class="flex items-center gap-2 text-[10px] font-medium uppercase tracking-[0.25em] text-muted">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="11" width="14" height="10" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        Carnet de recherche privé · Ne pas partager
      </p>
    </div>
  </footer>

  <!-- JAVASCRIPT : la liste des contenus, puis le fonctionnement des pages -->
  <script src="contenus.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
