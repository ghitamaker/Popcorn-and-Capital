<!-- Illustration par défaut — Blumhouse : une maison dans la nuit, une seule fenêtre allumée. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141825"/>
      <stop offset="1" stop-color="#2B2433"/>
    </linearGradient>
    <radialGradient id="lune" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F6E7C8"/>
      <stop offset=".7" stop-color="#F6E7C8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F6E7C8" stop-opacity="0"/>
    </radialGradient>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#ciel)"/>
  <circle cx="300" cy="70" r="34" fill="url(#lune)"/>
  <!-- Colline -->
  <path d="M0 250 Q120 222 220 236 T400 230 V300 H0 Z" fill="#0C0D12"/>
  <!-- Maison -->
  <g fill="#0C0D12">
    <rect x="140" y="150" width="120" height="92"/>
    <polygon points="128,154 200,96 272,154"/>
    <rect x="232" y="106" width="14" height="32"/>
    <rect x="186" y="200" width="28" height="42"/>
  </g>
  <!-- Fenêtres : une seule allumée -->
  <rect x="158" y="166" width="22" height="24" fill="#1B1D26"/>
  <rect x="220" y="166" width="22" height="24" fill="#C8503F"/>
  <rect x="220" y="166" width="22" height="24" fill="#EF5B4C" opacity=".7" filter="url(#halo)"/>
  <path d="M231 166 V190 M220 178 H242" stroke="#0C0D12" stroke-width="2"/>
  <!-- Arbre nu -->
  <path d="M86 246 V180 M86 200 L66 182 M86 192 L104 172 M86 214 L70 204" stroke="#0C0D12" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
