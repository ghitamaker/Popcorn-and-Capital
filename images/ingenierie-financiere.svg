<!-- Illustration par défaut — catégorie Ingénierie Financière (bobine + pièces).
     Remplaçable par une vraie photo : voir les commentaires dans index.html. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFE6D8"/><stop offset="1" stop-color="#D9C6A8"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="248" rx="150" ry="14" fill="#000" opacity=".08"/>
  <!-- Bobine de film -->
  <g transform="translate(150 150)">
    <circle r="82" fill="#2E2926"/>
    <circle r="78" fill="none" stroke="#4A423D" stroke-width="2"/>
    <circle r="14" fill="#D9C6A8"/>
    <circle cy="-44" r="20" fill="#E4D6C0"/><circle cy="44" r="20" fill="#E4D6C0"/>
    <circle cx="-44" r="20" fill="#E4D6C0"/><circle cx="44" r="20" fill="#E4D6C0"/>
  </g>
  <!-- Pellicule qui se déroule -->
  <path d="M228 172 C 270 200, 300 225, 360 230 L 360 252 C 300 248, 262 226, 220 196 Z" fill="#2E2926"/>
  <!-- Pile de pièces -->
  <g fill="#C9973A" stroke="#8E6A25" stroke-width="2">
    <ellipse cx="290" cy="236" rx="38" ry="11"/><rect x="252" y="214" width="76" height="22" stroke="none"/><ellipse cx="290" cy="214" rx="38" ry="11"/>
    <rect x="252" y="196" width="76" height="18" stroke="none"/><ellipse cx="290" cy="196" rx="38" ry="11"/>
    <rect x="252" y="178" width="76" height="18" stroke="none"/><ellipse cx="290" cy="178" rx="38" ry="11" fill="#E0B456"/>
  </g>
  <text x="290" y="183" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#8E6A25">€</text>
</svg>
