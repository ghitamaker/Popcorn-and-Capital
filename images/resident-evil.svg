<!-- Illustration de l'étude de cas « Resident Evil et Constantin Film » :
     la seringue Umbrella Corp. au liquide vert fluo (scène finale du film de 2026),
     rendu réaliste : verre en volume, reflets, sol brillant, grain photo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <!-- ===== Décor ===== -->
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A17"/>
      <stop offset=".8" stop-color="#070A09"/>
    </linearGradient>
    <radialGradient id="lumiere" cx=".56" cy=".42" r=".45">
      <stop offset="0" stop-color="#3DFF6E" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#3DFF6E" stop-opacity=".06"/>
      <stop offset="1" stop-color="#3DFF6E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1311"/>
      <stop offset="1" stop-color="#030404"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
    <linearGradient id="reflet-fondu" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="300">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="masque-reflet" maskUnits="userSpaceOnUse" x="0" y="250" width="400" height="50">
      <rect x="0" y="250" width="400" height="50" fill="url(#reflet-fondu)"/>
    </mask>

    <!-- ===== Matières de la seringue ===== -->
    <!-- Liquide : sombre sur les bords, très lumineux au cœur (effet cylindre) -->
    <linearGradient id="liquide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B8F28"/>
      <stop offset=".22" stop-color="#4DFF63"/>
      <stop offset=".38" stop-color="#D6FFC7"/>
      <stop offset=".5" stop-color="#7DFF7F"/>
      <stop offset=".8" stop-color="#22D446"/>
      <stop offset="1" stop-color="#066B1D"/>
    </linearGradient>
    <!-- Verre : reflets plus forts sur les bords du tube -->
    <linearGradient id="verre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset=".12" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".88" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="plastique" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E7975"/>
      <stop offset=".35" stop-color="#E3E9E7"/>
      <stop offset=".6" stop-color="#A8B3AF"/>
      <stop offset="1" stop-color="#4C5552"/>
    </linearGradient>
    <linearGradient id="caoutchouc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0F0E"/>
      <stop offset=".35" stop-color="#3A4441"/>
      <stop offset="1" stop-color="#070908"/>
    </linearGradient>
    <linearGradient id="etiquette-ombre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/>
      <stop offset=".25" stop-color="#000" stop-opacity="0"/>
      <stop offset=".7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C3CCC9"/>
      <stop offset="1" stop-color="#5E6865"/>
    </linearGradient>
    <radialGradient id="goutte" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#E8FFE0"/>
      <stop offset=".4" stop-color="#5BFF68"/>
      <stop offset="1" stop-color="#0A9A2C"/>
    </radialGradient>

    <!-- ===== Effets ===== -->
    <filter id="halo" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="flou-doux" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="ombre" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- ===== La seringue (dessinée à l'horizontale, puis inclinée) ===== -->
    <g id="seringue" transform="rotate(-28 205 140)">
      <!-- Lumière verte émise par le liquide -->
      <rect x="172" y="114" width="132" height="52" rx="10" fill="#3DFF6E" opacity=".6" filter="url(#halo)"/>

      <!-- Appui du pouce + tige du piston -->
      <rect x="40" y="106" width="14" height="68" rx="5" fill="url(#plastique)"/>
      <rect x="54" y="133" width="116" height="14" rx="2" fill="url(#plastique)"/>
      <line x1="56" y1="140" x2="168" y2="140" stroke="#2F3735" stroke-width="1" opacity=".6"/>

      <!-- Collerette translucide -->
      <rect x="122" y="94" width="10" height="92" rx="3" fill="#E9F0EE" opacity=".55"/>
      <rect x="122.5" y="94.5" width="9" height="91" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".6"/>

      <!-- Liquide vert fluo -->
      <rect x="176" y="118" width="122" height="44" rx="4" fill="url(#liquide)"/>
      <!-- Bulles -->
      <g fill="#F2FFEC">
        <circle cx="288" cy="125" r="2.4" opacity=".9"/>
        <circle cx="281" cy="131" r="1.4" opacity=".8"/>
        <circle cx="292" cy="134" r="1" opacity=".7"/>
        <circle cx="186" cy="124" r="1.6" opacity=".7"/>
      </g>

      <!-- Joint en caoutchouc (deux anneaux) -->
      <rect x="164" y="116" width="14" height="48" rx="2.5" fill="url(#caoutchouc)"/>
      <line x1="168.5" y1="117" x2="168.5" y2="163" stroke="#000" stroke-width="1.2" opacity=".7"/>
      <line x1="173.5" y1="117" x2="173.5" y2="163" stroke="#000" stroke-width="1.2" opacity=".7"/>

      <!-- Corps en verre -->
      <rect x="134" y="112" width="170" height="56" rx="6" fill="url(#verre)"/>
      <rect x="134" y="112" width="170" height="56" rx="6" fill="none" stroke="#E8F0EE" stroke-width="1.6" opacity=".85"/>

      <!-- Graduations -->
      <g stroke="#1D2523" stroke-width="1" opacity=".55">
        <line x1="182" y1="112" x2="182" y2="121"/><line x1="190" y1="112" x2="190" y2="117"/>
        <line x1="278" y1="112" x2="278" y2="121"/><line x1="286" y1="112" x2="286" y2="117"/><line x1="294" y1="112" x2="294" y2="121"/>
      </g>

      <!-- Étiquette Umbrella Corp., enroulée autour du tube -->
      <rect x="196" y="120" width="80" height="40" rx="1.5" fill="#F3F3EF"/>
      <text x="236" y="136" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="900" font-style="italic" textLength="64" lengthAdjust="spacingAndGlyphs" fill="#111">UMBRELLA</text>
      <text x="236" y="143.5" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="5.2" font-weight="700" letter-spacing="1.3" fill="#111">CORPORATION</text>
      <text x="204" y="151" font-family="'Courier New', monospace" font-size="4" font-weight="700" fill="#333">T-VIRUS · ANTIVIRUS</text>
      <text x="204" y="155.5" font-family="'Courier New', monospace" font-size="3.6" fill="#555">LOT 2026-001 · 30 ml</text>
      <!-- Petit code-barres -->
      <g fill="#222">
        <rect x="257" y="148" width=".8" height="8"/><rect x="259" y="148" width="1.4" height="8"/><rect x="261.4" y="148" width=".6" height="8"/>
        <rect x="263" y="148" width="1.6" height="8"/><rect x="265.6" y="148" width=".8" height="8"/><rect x="267.4" y="148" width="1.2" height="8"/><rect x="269.4" y="148" width=".6" height="8"/>
      </g>
      <rect x="196" y="156.5" width="80" height="3.5" fill="#C8102E"/>
      <!-- Ombre de courbure de l'étiquette -->
      <rect x="196" y="120" width="80" height="40" rx="1.5" fill="url(#etiquette-ombre)"/>

      <!-- Reflets de lumière sur le verre -->
      <rect x="140" y="115.5" width="158" height="3.2" rx="1.6" fill="#FFFFFF" opacity=".75"/>
      <rect x="146" y="163" width="150" height="1.6" rx=".8" fill="#FFFFFF" opacity=".25"/>

      <!-- Embout conique + raccord de l'aiguille -->
      <path d="M304 126 Q312 128 316 134 V146 Q312 152 304 154 Z" fill="#E1E9E6" opacity=".75"/>
      <path d="M316 133 H326 L330 137 V143 L326 147 H316 Z" fill="url(#plastique)"/>

      <!-- Aiguille en acier, pointe biseautée -->
      <polygon points="330,138.6 392,138.6 421,140.2 392,141.4 330,141.4" fill="url(#acier)"/>
      <polygon points="392,138.6 421,140.2 398,140" fill="#FFFFFF" opacity=".9"/>

      <!-- Goutte au bout de l'aiguille -->
      <circle cx="421" cy="143.2" r="2.7" fill="url(#goutte)"/>
      <circle cx="421" cy="143.2" r="8" fill="#3DFF6E" opacity=".35" filter="url(#halo)"/>
    </g>
  </defs>

  <!-- ===== Composition ===== -->
  <rect width="400" height="300" fill="url(#fond)"/>

  <!-- Lumières floues à l'arrière-plan (laboratoire) -->
  <g filter="url(#bokeh)">
    <circle cx="58" cy="58" r="14" fill="#9FFFC0" opacity=".10"/>
    <circle cx="96" cy="36" r="8" fill="#FFFFFF" opacity=".08"/>
    <circle cx="342" cy="200" r="12" fill="#5CFF8A" opacity=".08"/>
    <circle cx="30" cy="150" r="9" fill="#9FFFC0" opacity=".06"/>
  </g>
  <rect width="400" height="300" fill="url(#lumiere)"/>

  <!-- Sol brillant -->
  <rect y="250" width="400" height="50" fill="url(#sol)"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#25322E" stroke-width="1"/>
  <!-- Lumière verte projetée au sol -->
  <ellipse cx="230" cy="262" rx="130" ry="10" fill="#3DFF6E" opacity=".12" filter="url(#ombre)"/>
  <!-- Reflet de la seringue dans le sol -->
  <g mask="url(#masque-reflet)">
    <use href="#seringue" transform="matrix(1 0 0 -1 0 500)" filter="url(#flou-doux)"/>
  </g>
  <!-- Ombre portée -->
  <ellipse cx="200" cy="256" rx="95" ry="5" fill="#000" opacity=".6" filter="url(#ombre)"/>

  <!-- Flaque et gouttes tombées au sol -->
  <ellipse cx="334" cy="257" rx="22" ry="6" fill="#3DFF6E" opacity=".25" filter="url(#halo)"/>
  <ellipse cx="334" cy="256.5" rx="10" ry="2.8" fill="url(#goutte)"/>
  <ellipse cx="331" cy="255.6" rx="3.5" ry=".9" fill="#F2FFEC" opacity=".8"/>
  <circle cx="356" cy="222" r="2.6" fill="url(#goutte)"/>

  <!-- La seringue -->
  <use href="#seringue"/>

  <!-- Vignettage + grain photo -->
  <rect width="400" height="300" fill="url(#vignette)"/>
  <rect width="400" height="300" filter="url(#grain)" opacity=".07"/>
</svg>
