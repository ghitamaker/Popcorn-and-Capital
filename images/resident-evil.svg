<!-- Illustration de l'étude de cas « Resident Evil et Constantin Film » :
     la seringue Umbrella Corp. au liquide vert fluo (scène finale du film de 2026). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18201E"/>
      <stop offset="1" stop-color="#0A0D0C"/>
    </linearGradient>
    <radialGradient id="lueur" cx=".55" cy=".45" r=".5">
      <stop offset="0" stop-color="#39FF6A" stop-opacity=".30"/>
      <stop offset="1" stop-color="#39FF6A" stop-opacity="0"/>
    </radialGradient>
    <!-- Liquide fluo : plus clair au centre, comme s'il émettait de la lumière -->
    <linearGradient id="liquide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8FF9E"/>
      <stop offset=".35" stop-color="#52FF5E"/>
      <stop offset="1" stop-color="#14C83A"/>
    </linearGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8F7"/>
      <stop offset="1" stop-color="#9AA6A2"/>
    </linearGradient>
    <filter id="halo" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#fond)"/>
  <rect width="400" height="300" fill="url(#lueur)"/>

  <!-- Sol -->
  <rect y="246" width="400" height="54" fill="#070908"/>
  <line x1="0" y1="246" x2="400" y2="246" stroke="#22302C" stroke-width="2"/>
  <ellipse cx="210" cy="256" rx="110" ry="7" fill="#000" opacity=".55"/>

  <!-- Gouttes fluo tombées au sol -->
  <g fill="#52FF5E">
    <ellipse cx="330" cy="250" rx="9" ry="3" opacity=".9"/>
    <ellipse cx="330" cy="250" rx="16" ry="5" opacity=".25" filter="url(#halo)"/>
    <circle cx="352" cy="214" r="3"/>
  </g>

  <!-- Seringue, inclinée -->
  <g transform="rotate(-28 205 150)">

    <!-- Halo vert autour du liquide -->
    <rect x="176" y="128" width="122" height="44" rx="8" fill="#39FF6A" opacity=".55" filter="url(#halo)"/>

    <!-- Piston (tige + appui du pouce) -->
    <rect x="58" y="144" width="110" height="12" rx="2" fill="#5B6662"/>
    <rect x="44" y="120" width="14" height="60" rx="4" fill="#7C8884"/>

    <!-- Collerette -->
    <rect x="124" y="110" width="10" height="80" rx="3" fill="#DCE6E2" opacity=".9"/>

    <!-- Liquide vert fluo -->
    <rect x="174" y="129" width="124" height="42" rx="5" fill="url(#liquide)"/>
    <!-- Bulles -->
    <g fill="#E6FFDA" opacity=".85">
      <circle cx="286" cy="137" r="2.2"/><circle cx="279" cy="143" r="1.4"/><circle cx="184" cy="136" r="1.6"/>
    </g>

    <!-- Joint en caoutchouc du piston -->
    <rect x="164" y="127" width="12" height="46" rx="2" fill="#1E2422"/>

    <!-- Corps en verre (reflet + contour) -->
    <rect x="134" y="124" width="170" height="52" rx="8" fill="#DCE6E2" opacity=".07"/>
    <rect x="134" y="124" width="170" height="52" rx="8" fill="none" stroke="#DCE6E2" stroke-width="3"/>
    <rect x="142" y="128" width="154" height="5" rx="2.5" fill="#FFFFFF" opacity=".35"/>

    <!-- Graduations -->
    <g stroke="#DCE6E2" stroke-width="2" opacity=".85">
      <line x1="186" y1="124" x2="186" y2="134"/><line x1="190" y1="124" x2="190" y2="130"/>
      <line x1="282" y1="124" x2="282" y2="134"/><line x1="270" y1="124" x2="270" y2="130"/>
    </g>

    <!-- Étiquette Umbrella Corp. -->
    <rect x="198" y="134" width="76" height="32" rx="2" fill="#F4F4F2"/>
    <text x="236" y="149" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="900" font-style="italic" letter-spacing=".2" textLength="66" lengthAdjust="spacingAndGlyphs" fill="#111">UMBRELLA</text>
    <text x="236" y="159.5" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="7" font-weight="700" letter-spacing="1.6" fill="#111">CORP.</text>
    <rect x="198" y="162" width="76" height="4" fill="#C8102E"/>

    <!-- Embout -->
    <path d="M304 140 H316 L324 146 V154 L316 160 H304 Z" fill="#C7D2CE"/>

    <!-- Aiguille, avec pointe biseautée bien acérée -->
    <polygon points="324,148 392,148 418,150.2 392,152 324,152" fill="url(#acier)"/>
    <line x1="326" y1="148.8" x2="390" y2="148.8" stroke="#FFFFFF" stroke-width=".8" opacity=".8"/>

    <!-- Goutte fluo au bout de l'aiguille -->
    <circle cx="419" cy="153" r="3" fill="#52FF5E"/>
    <circle cx="419" cy="153" r="7" fill="#52FF5E" opacity=".35" filter="url(#halo)"/>
  </g>
</svg>
