<!-- Illustration de l'étude de cas « Resident Evil et Constantin Film » :
     la seringue qui tombe au sol (scène finale du film de 2026). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2826"/>
      <stop offset="1" stop-color="#0E1211"/>
    </linearGradient>
    <radialGradient id="lueur" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#5FBF7A" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5FBF7A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fond)"/>
  <rect width="400" height="300" fill="url(#lueur)"/>

  <!-- Sol -->
  <rect y="236" width="400" height="64" fill="#0A0D0C"/>
  <line x1="0" y1="236" x2="400" y2="236" stroke="#2C3835" stroke-width="2"/>
  <ellipse cx="214" cy="246" rx="84" ry="7" fill="#000" opacity=".5"/>

  <!-- Gouttes -->
  <g fill="#7FD99A">
    <ellipse cx="292" cy="226" rx="5" ry="2.4" opacity=".9"/>
    <circle cx="276" cy="190" r="3.2"/>
    <circle cx="300" cy="168" r="2.2" opacity=".8"/>
  </g>

  <!-- Seringue inclinée -->
  <g transform="rotate(-28 200 160)">
    <!-- Piston -->
    <rect x="72" y="150" width="46" height="8" rx="2" fill="#56605D"/>
    <rect x="62" y="136" width="10" height="36" rx="3" fill="#6E7875"/>
    <!-- Corps en verre -->
    <rect x="118" y="132" width="150" height="44" rx="8" fill="#DCE6E2" opacity=".18" stroke="#DCE6E2" stroke-width="3"/>
    <!-- Liquide vert -->
    <rect x="160" y="137" width="104" height="34" rx="5" fill="#5FBF7A"/>
    <rect x="160" y="137" width="104" height="9" rx="4" fill="#9BE8B2" opacity=".6"/>
    <!-- Joint du piston -->
    <rect x="150" y="135" width="10" height="38" rx="2" fill="#2B3230"/>
    <!-- Graduations -->
    <g stroke="#DCE6E2" stroke-width="2" opacity=".8">
      <line x1="180" y1="132" x2="180" y2="144"/><line x1="200" y1="132" x2="200" y2="140"/>
      <line x1="220" y1="132" x2="220" y2="144"/><line x1="240" y1="132" x2="240" y2="140"/>
    </g>
    <!-- Collerette + embout -->
    <rect x="112" y="124" width="8" height="60" rx="3" fill="#DCE6E2" opacity=".85"/>
    <rect x="268" y="146" width="18" height="16" rx="3" fill="#C7D2CE"/>
    <!-- Aiguille -->
    <line x1="286" y1="154" x2="352" y2="154" stroke="#E8EFEC" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
