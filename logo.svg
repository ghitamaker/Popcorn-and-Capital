<!--
  LOGO POPCORN & CAPITAL
  Un ticket de cinéma rouge : sur la partie principale, une pellicule dont les
  images forment des barres qui montent (le cinéma + la finance) ; sur le talon
  doré qu'on détache, un pot de pop-corn.
  Ce fichier sert à la fois de logo (dans l'en-tête) et d'icône d'onglet (favicon).
  ⚠️ Il doit rester dans le même dossier que les pages .html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Forme du ticket : coins arrondis + une encoche de chaque côté -->
    <path id="pc-ticket" d="M8 12 H40 A4 4 0 0 1 44 16 V20 A4 4 0 0 0 44 28 V32 A4 4 0 0 1 40 36 H8 A4 4 0 0 1 4 32 V28 A4 4 0 0 0 4 20 V16 A4 4 0 0 1 8 12 Z"/>
    <clipPath id="pc-clip"><use href="#pc-ticket"/></clipPath>
  </defs>

  <!-- Le ticket, légèrement incliné -->
  <g transform="translate(24 24) rotate(-10) scale(1.12) translate(-24 -24)">
    <!-- Corps du ticket (rouge cinéma) -->
    <use href="#pc-ticket" fill="#C8503F"/>
    <!-- Talon détachable (doré) -->
    <rect x="31" y="12" width="13" height="24" fill="#F2B544" clip-path="url(#pc-clip)"/>
    <!-- Pointillés de découpe -->
    <line x1="31" y1="13.5" x2="31" y2="34.5" stroke="#FBEFD9" stroke-width="1.2" stroke-dasharray="2 1.6"/>

    <!-- Pellicule dont les images forment des barres qui montent (centrée) -->
    <rect x="6.75" y="15.5" width="21.5" height="17" rx="1" fill="#26221E"/>
    <g fill="#FBEFD9"><rect x="8.15" y="16.6" width="1.6" height="1.4" rx=".3"/><rect x="11.95" y="16.6" width="1.6" height="1.4" rx=".3"/><rect x="15.75" y="16.6" width="1.6" height="1.4" rx=".3"/><rect x="19.55" y="16.6" width="1.6" height="1.4" rx=".3"/><rect x="23.35" y="16.6" width="1.6" height="1.4" rx=".3"/><rect x="8.15" y="30" width="1.6" height="1.4" rx=".3"/><rect x="11.95" y="30" width="1.6" height="1.4" rx=".3"/><rect x="15.75" y="30" width="1.6" height="1.4" rx=".3"/><rect x="19.55" y="30" width="1.6" height="1.4" rx=".3"/><rect x="23.35" y="30" width="1.6" height="1.4" rx=".3"/></g>
    <rect x="9.25" y="25.5" width="4" height="3.5" fill="#F2B544" opacity=".55"/>
    <rect x="15.25" y="22.8" width="4" height="6.2" fill="#F2B544" opacity=".8"/>
    <rect x="21.25" y="19.6" width="4" height="9.4" fill="#F2B544"/>

    <!-- Pot de pop-corn sur le talon -->
    <g stroke="#26221E" stroke-width=".55">
      <circle cx="34.3" cy="21.7" r="1.35" fill="#FBEFD9"/><circle cx="36.9" cy="21.7" r="1.35" fill="#FBEFD9"/><circle cx="35.6" cy="20.6" r="1.45" fill="#FBEFD9"/>
      <path d="M33.1 22.6 H38.1 L37.3 28.6 H33.9 Z" fill="#C8503F" stroke-linejoin="round"/>
    </g>
    <path d="M35.6 22.9 V28.3" stroke="#FBEFD9" stroke-width=".9"/>
  </g>
</svg>
