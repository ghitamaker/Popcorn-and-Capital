<!--
  LOGO POPCORN & CAPITAL
  Un ticket de cinéma rouge : sur la partie principale, une pile de pièces et
  une flèche qui monte (la finance) ; sur le talon doré qu'on détache, une étoile
  (le cinéma, le succès en salle).
  Ce fichier sert à la fois de logo (dans l'en-tête) et d'icône d'onglet (favicon).
  ⚠️ Il doit rester dans le même dossier que les pages .html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Forme du ticket : coins arrondis + une encoche de chaque côté -->
    <path id="pc-ticket" d="M8 12 H40 A4 4 0 0 1 44 16 V20 A4 4 0 0 0 44 28 V32 A4 4 0 0 1 40 36 H8 A4 4 0 0 1 4 32 V28 A4 4 0 0 0 4 20 V16 A4 4 0 0 1 8 12 Z"/>
    <clipPath id="pc-clip"><use href="#pc-ticket"/></clipPath>
  </defs>

  <!-- Le ticket, légèrement incliné -->
  <g transform="translate(24 24) rotate(-10) scale(1.12) translate(-24 -24)">
    <!-- Corps du ticket (rouge cinéma) -->
    <use href="#pc-ticket" fill="#C8503F"/>
    <!-- Talon détachable (doré) -->
    <rect x="31" y="12" width="13" height="24" fill="#F2B544" clip-path="url(#pc-clip)"/>
    <!-- Pointillés de découpe -->
    <line x1="31" y1="13.5" x2="31" y2="34.5" stroke="#FBEFD9" stroke-width="1.2" stroke-dasharray="2 1.6"/>

    <!-- Pile de pièces + flèche montante, centrées sur la partie principale -->
    <g transform="translate(-1.1 -0.55)">
      <g fill="#F2B544">
        <rect x="9" y="19" width="10" height="12"/>
        <ellipse cx="14" cy="31" rx="5" ry="1.8" stroke="#26221E" stroke-width=".7"/>
        <rect x="9" y="27" width="10" height="4"/>
        <ellipse cx="14" cy="27" rx="5" ry="1.8" stroke="#26221E" stroke-width=".7"/>
        <rect x="9" y="23" width="10" height="4"/>
        <ellipse cx="14" cy="23" rx="5" ry="1.8" stroke="#26221E" stroke-width=".7"/>
        <rect x="9" y="19" width="10" height="4"/>
        <ellipse cx="14" cy="19" rx="5" ry="1.8" fill="#F8D27A" stroke="#26221E" stroke-width=".7"/>
      </g>
      <path d="M9 19 V31 M19 19 V31" stroke="#26221E" stroke-width=".7"/>
      <path d="M25 31.5 V17 M21.8 20.3 L25 17 L28.2 20.3" stroke="#FBEFD9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Étoile sur le talon -->
    <polygon points="35.60,20.40 36.48,22.79 39.02,22.89 37.03,24.46 37.72,26.91 35.60,25.50 33.48,26.91 34.17,24.46 32.18,22.89 34.72,22.79" fill="#26221E" stroke="#26221E" stroke-width=".6" stroke-linejoin="round"/>
  </g>
</svg>
