<!--
  LOGO POPCORN & CAPITAL (noir et blanc)
  Un clap de cinéma dont l'ardoise affiche un graphique boursier en hausse.
  Ce fichier sert à la fois de logo (dans l'en-tête) et d'icône d'onglet (favicon).
  ⚠️ Il doit rester dans le même dossier que les pages .html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Claquette (partie haute du clap), légèrement ouverte -->
  <g transform="rotate(-12 6 17)">
    <rect x="6" y="9" width="36" height="7" rx="1.5" fill="#1A1A1A"/>
    <path d="M13 9h5l-4 7h-5z M23 9h5l-4 7h-5z M33 9h5l-4 7h-5z" fill="#FFFFFF"/>
  </g>

  <!-- Ardoise (corps du clap) -->
  <rect x="6" y="18" width="36" height="24" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Barres du graphique -->
  <rect x="12" y="33" width="4" height="5" rx="1" fill="#1A1A1A" opacity=".3"/>
  <rect x="19" y="30" width="4" height="8" rx="1" fill="#1A1A1A" opacity=".5"/>
  <rect x="26" y="27" width="4" height="11" rx="1" fill="#1A1A1A" opacity=".7"/>

  <!-- Courbe en hausse + flèche -->
  <polyline points="11,31 18,26 25,28 36,21" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="31.5,21 36,21 36,25.5" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
